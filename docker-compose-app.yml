version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: db_menudigital
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=true
      - MYSQL_DATABASE=${MYSQL_DATABASE}


    ports:
      - "3306:3306"

    networks:
      - app_network

  redis:
    image: redis:latest
    container_name: redis_dev
    ports:
      - "6379:6379"
    networks:
      - app_network

  app:
    image: enferrela/dashboard-back:v3
    container_name: spring_app_dev
    ports:
      - "8090:8090"
    depends_on:
      - db
      - redis
    networks:
      - app_network
    restart: always



networks:
  app_network:
    driver: bridge


